apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: shop-prod

resources:
- ../../base
- namespace.yaml

images:
- name: ghcr.io/stefanprodan/podinfo
  newTag: 6.14.1

replicas:
- name: web
  count: 2

patches:
- target:
    kind: Ingress
    name: web
  patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: shop.example.com